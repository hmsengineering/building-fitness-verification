<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Certificate Verification</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#0d2b4e; --green:#0b6e4f; --accent:#1463e9;
  --ink:#1f2937; --muted:#6b7280; --line:#e6e9ee; --bg:#eef2f8;
}
*{box-sizing:border-box;}
body{margin:0;font-family:'Inter',Arial,sans-serif;color:var(--ink);
  background:
    radial-gradient(circle at 15% 0%, #f3f7ff 0%, transparent 45%),
    radial-gradient(circle at 100% 10%, #eefaf3 0%, transparent 40%),
    var(--bg);
  min-height:100vh;
}
.header{
  background:linear-gradient(135deg,var(--navy),var(--green));
  color:#fff; padding:52px 20px 64px; text-align:center; position:relative;
}
.seal{
  width:60px;height:60px;margin:0 auto 14px;
  background:rgba(255,255,255,0.12); border:2px solid rgba(255,255,255,0.55);
  border-radius:50%; display:flex; align-items:center; justify-content:center;
}
.header h1{margin:0;font-size:28px;font-weight:800;letter-spacing:.3px;}
.header p{margin:8px 0 0;font-size:14px;opacity:.85;letter-spacing:.5px;text-transform:uppercase;}
.container{max-width:760px;margin:-38px auto 40px;padding:0 20px;position:relative;}
.card{background:#fff;border-radius:18px;padding:36px;box-shadow:0 20px 45px -20px rgba(13,43,78,0.35);border:1px solid var(--line);}
.badge{
  display:flex; align-items:center; justify-content:center; gap:10px;
  color:#0a7a4f; font-weight:700; font-size:17px;
  background:#e9faf1; border:1px solid #b9ecd0; border-radius:12px;
  padding:16px; margin-bottom:8px;
}
.badge svg{flex-shrink:0;}
.certno{text-align:center;color:var(--muted);font-size:13px;letter-spacing:.4px;margin:6px 0 28px;}
.schoolname{text-align:center;font-size:24px;font-weight:800;color:var(--navy);margin:0 0 26px;}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:0;border-top:1px solid var(--line);}
.grid .info{border-bottom:1px solid var(--line);padding:16px 4px;}
.grid .info:nth-child(odd){padding-right:16px;}
.grid .info:nth-child(even){padding-left:16px;border-left:1px solid var(--line);}
.info strong{display:block;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.6px;margin-bottom:5px;font-weight:600;}
.info span{font-size:15px;font-weight:600;color:var(--ink);}
.not-verified{text-align:center;color:#b42318;font-size:20px;font-weight:700;padding:18px;background:#fdecea;border-radius:12px;border:1px solid #f5c2be;}
.documents{margin-top:30px;}
.documents h2{color:var(--navy);margin-bottom:16px;font-size:16px;font-weight:700;display:flex;align-items:center;gap:8px;}
.document{
  border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin-bottom:12px;
  background:#fbfcfe; display:flex; align-items:center; justify-content:space-between; gap:14px; flex-wrap:wrap;
}
.doc-left{display:flex;align-items:center;gap:12px;}
.doc-icon{width:38px;height:38px;border-radius:8px;background:#eaf1ff;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.document-title{font-weight:600;font-size:14.5px;}
.btns{display:flex;gap:8px;flex-wrap:wrap;}
.button{display:inline-flex;align-items:center;gap:6px;background:var(--accent);color:#fff;padding:9px 15px;border-radius:8px;text-decoration:none;font-weight:600;font-size:13.5px;}
.button:hover{background:#0d4fc2;}
.button.secondary{background:#eef2f7;color:var(--navy);}
.button.secondary:hover{background:#dde5ee;}
.footer{text-align:center;margin-top:14px;padding:26px 15px 10px;color:var(--muted);font-size:13px;}
.footer .sig{border-top:1px solid var(--line);max-width:280px;margin:0 auto 12px;padding-top:14px;}
.footer strong{display:block;color:var(--navy);font-size:15px;margin-bottom:2px;}
.backlink{display:block;text-align:center;margin-top:18px;color:var(--accent);font-size:13px;text-decoration:none;font-weight:600;}
.backlink:hover{text-decoration:underline;}
@media(max-width:520px){.grid{grid-template-columns:1fr;}.grid .info:nth-child(even){padding-left:4px;border-left:none;}.grid .info:nth-child(odd){padding-right:4px;}}
</style>
</head>
<body>
<div class="header">
  <div class="seal">
    <svg width="28" height="28" viewBox="0 0 24 24" fill="none"><path d="M12 2l7 3v6c0 5-3.5 8.5-7 10-3.5-1.5-7-5-7-10V5l7-3z" stroke="#fff" stroke-width="1.6" fill="rgba(255,255,255,0.15)"/><path d="M9 12l2 2 4-4" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
  </div>
  <h1>Building Fitness Certificate</h1>
  <p>Official Certificate Verification System</p>
</div>
<div class="container" id="content">
  <div class="card" style="text-align:center;">Loading certificate details…</div>
</div>

<script>
async function loadCertificate() {
  const params = new URLSearchParams(window.location.search);
  const slug = params.get('school');
  const content = document.getElementById('content');

  if (!slug) {
    content.innerHTML = `<div class="card"><div class="not-verified">⚠ No certificate specified</div></div>`;
    return;
  }

  try {
    const res = await fetch('../data/schools.json');
    const schools = await res.json();
    const school = schools.find(s => s.slug === slug);

    if (!school) {
      content.innerHTML = `<div class="card"><div class="not-verified">✕ CERTIFICATE NOT FOUND</div><p style="text-align:center;margin-top:15px;color:#6b7280;">This link could not be verified. Please contact the issuing engineer.</p></div>`;
      return;
    }

    let docsHtml = '';
    school.documents.forEach(doc => {
      const path = `../school/${school.folder}/${doc.file}`;
      docsHtml += `
        <div class="document">
          <div class="doc-left">
            <div class="doc-icon">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M6 2h9l5 5v15H6V2z" stroke="#1463e9" stroke-width="1.5"/><path d="M15 2v5h5" stroke="#1463e9" stroke-width="1.5"/></svg>
            </div>
            <div class="document-title">${doc.label}</div>
          </div>
          <div class="btns">
            <a class="button" href="${path}" target="_blank">View PDF</a>
            <a class="button secondary" href="${path}" download>Download</a>
          </div>
        </div>`;
    });

    content.innerHTML = `
      <div class="card">
        <div class="badge">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="10" fill="#0a7a4f"/><path d="M8 12l2.5 2.5L16 9" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          CERTIFICATE VERIFIED
        </div>
        <div class="certno">Certificate No. ${school.certificateNumber}</div>
        <div class="schoolname">${school.schoolName}</div>
        <div class="grid">
          <div class="info"><strong>Certificate Type</strong><span>${school.certificateType}</span></div>
          <div class="info"><strong>Verification Status</strong><span>${school.status}</span></div>
          <div class="info"><strong>Inspection Date</strong><span>${school.inspectionDate}</span></div>
          <div class="info"><strong>Valid Until</strong><span>${school.validUntil}</span></div>
        </div>
        <div class="documents">
          <h2>📑 Official Documents</h2>
          ${docsHtml}
        </div>
      </div>
      <a class="backlink" href="../index.html">← Back to Home / Search</a>
      <div class="footer">
        <div class="sig">
          <strong>Engr. Hassan Mehmood Subhani</strong>
          PEC No. Civil/56341
        </div>
        Official Building Fitness Certificate Verification System
      </div>`;
  } catch (err) {
    content.innerHTML = `<div class="card"><div class="not-verified">⚠ Error loading certificate data</div></div>`;
  }
}
loadCertificate();
</script>
</body>
</html>
