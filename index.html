<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Building Fitness Certificate Verification</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f6f8;
        }

        .header {
            background: #123c69;
            color: white;
            text-align: center;
            padding: 30px 15px;
        }

        .header h1 {
            margin: 0;
            font-size: 28px;
        }

        .header p {
            margin-top: 8px;
            font-size: 16px;
        }

        .container {
            max-width: 700px;
            margin: 40px auto;
            padding: 20px;
        }

        .card {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 3px 12px rgba(0,0,0,0.10);
            text-align: center;
        }

        .verified {
            color: #198754;
            font-size: 24px;
            font-weight: bold;
            margin: 20px 0;
        }

        .info {
            text-align: left;
            margin-top: 25px;
        }

        .row {
            padding: 12px 0;
            border-bottom: 1px solid #eee;
        }

        .label {
            font-weight: bold;
            color: #555;
        }

        .footer {
            text-align: center;
            color: #777;
            font-size: 13px;
            margin-top: 30px;
        }
    </style>
</head>

<body>

    <div class="header">
        <h1>Hassan Mehmood Subhani</h1>
        <p>Building Fitness Certificate Verification</p>
    </div>

    <div class="container">

        <div class="card">

            <h2>Certificate Verification</h2>

            <div class="verified">
                ✓ CERTIFICATE VERIFIED
            </div>

            <div class="info">

                <div class="row">
                    <div class="label">School Name</div>
                    <div>ABC Public School</div>
                </div>

                <div class="row">
                    <div class="label">Certificate No.</div>
                    <div>BFC/MTN/001/2026</div>
                </div>

                <div class="row">
                    <div class="label">Inspection Date</div>
                    <div>30 August 2026</div>
                </div>

                <div class="row">
                    <div class="label">Valid Until</div>
                    <div>30 August 2027</div>
                </div>

            </div>

        </div>

        <div class="footer">
            Official Building Fitness Certificate Verification
        </div>

    </div>

</body>
</html>
