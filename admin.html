<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin — Add New Certificate</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--navy:#0d2b4e;--green:#0b6e4f;--accent:#1463e9;--ink:#1f2937;--muted:#6b7280;--line:#e6e9ee;--bg:#eef2f8;}
*{box-sizing:border-box;}
body{margin:0;font-family:'Inter',Arial,sans-serif;color:var(--ink);background:var(--bg);min-height:100vh;}
.header{background:linear-gradient(135deg,var(--navy),var(--green));color:#fff;padding:36px 20px;text-align:center;}
.header h1{margin:0;font-size:24px;font-weight:800;}
.header p{margin:6px 0 0;font-size:13px;opacity:.85;}
.container{max-width:640px;margin:30px auto;padding:0 20px;}
.card{background:#fff;border-radius:16px;padding:30px;box-shadow:0 10px 30px -15px rgba(13,43,78,0.3);border:1px solid var(--line);}
.field{margin-bottom:16px;}
label{display:block;font-size:12.5px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;margin-bottom:6px;}
input,select{width:100%;padding:11px 13px;border:1px solid #d1d5db;border-radius:8px;font-size:14.5px;font-family:inherit;}
input:focus,select:focus{outline:2px solid #cddcfa;border-color:var(--accent);}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.section-title{font-size:13px;font-weight:700;color:var(--navy);margin:22px 0 12px;padding-top:14px;border-top:1px solid var(--line);text-transform:uppercase;letter-spacing:.4px;}
.section-title:first-of-type{border-top:none;padding-top:0;margin-top:0;}
button{width:100%;background:var(--accent);color:#fff;border:none;padding:14px;border-radius:10px;font-size:15px;font-weight:700;cursor:pointer;margin-top:10px;}
button:hover{background:#0d4fc2;}
button:disabled{background:#9ca3af;cursor:not-allowed;}
.msg{margin-top:16px;padding:14px;border-radius:10px;font-size:14px;display:none;}
.msg.success{display:block;background:#e9faf1;color:#0a7a4f;border:1px solid #b9ecd0;}
.msg.error{display:block;background:#fdecea;color:#b42318;border:1px solid #f5c2be;}
.hint{font-size:12px;color:var(--muted);margin-top:4px;}
.tokenbox{background:#fff8e6;border:1px solid #f5d98b;border-radius:10px;padding:14px;margin-bottom:20px;font-size:13px;color:#7a5c00;}
</style>
</head>
<body>
<div class="header">
  <h1>Admin Panel — Add New Certificate</h1>
  <p>This page is for internal use only</p>
</div>
<div class="container">
  <div class="card">
    <div class="tokenbox">🔒 Paste your GitHub token below (kept only in this browser session, never saved to the repo).</div>
    <div class="field">
      <label>GitHub Access Token</label>
      <input type="password" id="token" placeholder="github_pat_...">
    </div>

    <div class="section-title">School Details</div>
    <div class="field">
      <label>School Name</label>
      <input type="text" id="schoolName" placeholder="e.g. Oxford Science School" oninput="autoSlug()">
    </div>
    <div class="row2">
      <div class="field">
        <label>School Level</label>
        <select id="schoolLevel">
          <option>Primary</option>
          <option>Elementary</option>
          <option>Secondary</option>
          <option>Higher Secondary</option>
          <option>College</option>
          <option>Other</option>
        </select>
      </div>
      <div class="field">
        <label>School Gender</label>
        <select id="schoolGender">
          <option>Boys</option>
          <option>Girls</option>
          <option>Mixed / Co-education</option>
        </select>
      </div>
    </div>
    <div class="field">
      <label>School Owner Name</label>
      <input type="text" id="ownerName" placeholder="e.g. Mr. Ahmed Khan">
    </div>
    <div class="field">
      <label>Address</label>
      <input type="text" id="address" placeholder="Full school address">
    </div>

    <div class="section-title">Certificate Details</div>
    <div class="row2">
      <div class="field">
        <label>Certificate Number</label>
        <input type="text" id="certNumber" placeholder="BFC-2026-002">
      </div>
      <div class="field">
        <label>Status</label>
        <select id="status">
          <option>Valid / Verified</option>
          <option>Expired</option>
          <option>Revoked</option>
        </select>
      </div>
    </div>
    <div class="row2">
      <div class="field">
        <label>Inspection Date</label>
        <input type="text" id="inspectionDate" placeholder="29 August 2026">
      </div>
      <div class="field">
        <label>Valid Until</label>
        <input type="text" id="validUntil" placeholder="29 August 2028">
      </div>
    </div>

    <div class="section-title">Folder &amp; Files</div>
    <div class="field">
      <label>Folder Name (slug — auto-filled, no spaces)</label>
      <input type="text" id="slug" placeholder="oxford-science-school">
      <div class="hint">Must exactly match the folder name you create under school/</div>
    </div>
    <div class="field">
      <label>PDF Filename — Building Fitness Certificate</label>
      <input type="text" id="file1" value="Building-Fitness-Certificate.pdf">
    </div>
    <div class="field">
      <label>PDF Filename — School Document</label>
      <input type="text" id="file2" placeholder="Oxford-Science-School.pdf">
    </div>
    <div class="field">
      <label>PDF Filename — School Document (CL)</label>
      <input type="text" id="file3" placeholder="Oxford-Science-School-CL.pdf">
    </div>

    <button onclick="submitCertificate()" id="submitBtn">Add Certificate to Database</button>
    <div id="msg" class="msg"></div>
  </div>
</div>

<script>
const REPO = "hmsengineering/building-fitness-verification";
const FILE_PATH = "data/schools.json";

function slugify(str){
  return str.toLowerCase().trim().replace(/[^a-z0-9]+/g,'-').replace(/(^-|-$)/g,'');
}

function autoSlug(){
  const name = document.getElementById('schoolName').value;
  const slug = slugify(name);
  document.getElementById('slug').value = slug;
  if(name){
    const titleCase = name.split(' ').map(w=>w.charAt(0).toUpperCase()+w.slice(1)).join('-');
    document.getElementById('file2').value = titleCase + '.pdf';
    document.getElementById('file3').value = titleCase + '-CL.pdf';
  }
}

async function submitCertificate(){
  const btn = document.getElementById('submitBtn');
  const msg = document.getElementById('msg');
  msg.className = 'msg'; msg.style.display='none';

  const token = document.getElementById('token').value.trim();
  const schoolName = document.getElementById('schoolName').value.trim();
  const slug = document.getElementById('slug').value.trim();
  const certNumber = document.getElementById('certNumber').value.trim();

  if(!token || !schoolName || !slug || !certNumber){
    msg.className='msg error'; msg.style.display='block';
    msg.textContent = 'Please fill Token, School Name, Slug, and Certificate Number at minimum.';
    return;
  }

  const newEntry = {
    slug: slug,
    folder: slug,
    schoolName: schoolName,
    schoolLevel: document.getElementById('schoolLevel').value,
    schoolGender: document.getElementById('schoolGender').value,
    ownerName: document.getElementById('ownerName').value.trim(),
    address: document.getElementById('address').value.trim(),
    certificateType: "Building Fitness Certificate",
    certificateNumber: certNumber,
    inspectionDate: document.getElementById('inspectionDate').value.trim(),
    validUntil: document.getElementById('validUntil').value.trim(),
    status: document.getElementById('status').value,
    documents: [
      { label: "Building Fitness Certificate", file: document.getElementById('file1').value.trim() },
      { label: schoolName, file: document.getElementById('file2').value.trim() },
      { label: schoolName + " (CL)", file: document.getElementById('file3').value.trim() }
    ]
  };

  btn.disabled = true; btn.textContent = 'Saving...';

  try {
    const apiUrl = `https://api.github.com/repos/${REPO}/contents/${FILE_PATH}`;
    const getRes = await fetch(apiUrl, { headers: { Authorization: `token ${token}` } });
    if(!getRes.ok) throw new Error('Could not read schools.json — check your token permissions.');
    const fileData = await getRes.json();
    const currentContent = decodeURIComponent(escape(atob(fileData.content)));
    let schools = JSON.parse(currentContent);

    if(schools.some(s => s.slug === slug)){
      throw new Error('A school with this slug already exists: ' + slug);
    }

    schools.push(newEntry);
    const updatedContent = JSON.stringify(schools, null, 2);
    const encodedContent = btoa(unescape(encodeURIComponent(updatedContent)));

    const putRes = await fetch(apiUrl, {
      method: 'PUT',
      headers: { Authorization: `token ${token}`, 'Content-Type': 'application/json' },
      body: JSON.stringify({
        message: `Add ${schoolName} to schools data`,
        content: encodedContent,
        sha: fileData.sha
      })
    });

    if(!putRes.ok){
      const err = await putRes.json();
      throw new Error(err.message || 'Failed to save.');
    }

    msg.className = 'msg success'; msg.style.display='block';
    msg.innerHTML = `✅ Added successfully! Now create folder <b>school/${slug}/</b> and upload the 3 PDFs there.<br><br>Verification URL: <br><code>https://hmsengineering.github.io/building-fitness-verification/verify/?school=${slug}</code>`;
  } catch(err){
    msg.className = 'msg error'; msg.style.display='block';
    msg.textContent = '❌ ' + err.message;
  } finally {
    btn.disabled = false; btn.textContent = 'Add Certificate to Database';
  }
}
</script>
</body>
</html>
